{% extends "base.html" %}

{% block title %}
Book Trek
{% endblock %}

{% block content %}

<div class="container mt-5">

    <h2>Book {{ trek.name }}</h2>

    <form method="POST"
          action="{{ url_for('main.book_trek_post', trek_id=trek.id) }}">

        <div class="mb-3">

            <label class="form-label">
                Number of Persons
            </label>

            <input
                type="number"
                class="form-control"
                name="persons"
                value="1"
                min="1">

        </div>

        <button
            type="submit"
            class="btn btn-success">

            Confirm Booking

        </button>

    </form>

</div>

{% endblock %}
