{% extends "base.html" %}

{% block title %}
Book Trek
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow border-0">

                <div class="card-header bg-dark text-white text-center">
                    <h3 class="mb-0">🥾 Book Trek</h3>
                </div>

                <div class="card-body p-4">

                    <h4 class="text-center fw-bold mb-4">
                        {{ trek.name }}
                    </h4>

                    <div class="row mb-4">

                        <div class="col-6">

                            <p><strong>📍 Location:</strong> {{ trek.location }}</p>

                            <p><strong>⛰ Difficulty:</strong> {{ trek.difficulty }}</p>

                        </div>

                        <div class="col-6">

                            <p><strong>💰 Price:</strong> ₹{{ trek.price }}</p>

                            <p><strong>🎫 Available Slots:</strong> {{ trek.available_slots }}</p>

                        </div>

                    </div>

                    <form method="POST"
                          action="{{ url_for('main.book_trek_post', trek_id=trek.id) }}">

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Number of Persons
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                name="persons"
                                value="1"
                                min="1"
                                max="{{ trek.available_slots }}">

                        </div>

                        <div class="d-flex justify-content-between">

                            <a href="{{ url_for('main.user_dashboard') }}"
                               class="btn btn-outline-dark">
                                ← Dashboard
                            </a>

                            <button
                                type="submit"
                                class="btn btn-success">
                                ✅ Confirm Booking
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
