{% extends "base.html" %}

{% block title %}
Update Trek Status
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow border-0">

                <div class="card-header bg-dark text-white text-center">

                    <h3 class="mb-0">
                        🚩 Update Trek Status
                    </h3>

                </div>

                <div class="card-body p-4">

                    <form method="POST"
                          action="{{ url_for('main.update_trek_status_post', trek_id=trek.id) }}">

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Trek Status
                            </label>

                            <select
                                class="form-select"
                                name="status">

                                <option value="Open"
                                {% if trek.status=="Open" %}selected{% endif %}>
                                    Open
                                </option>

                                <option value="Closed"
                                {% if trek.status=="Closed" %}selected{% endif %}>
                                    Closed
                                </option>

                                <option value="Started"
                                {% if trek.status=="Started" %}selected{% endif %}>
                                    Started
                                </option>

                                <option value="Ongoing"
                                {% if trek.status=="Ongoing" %}selected{% endif %}>
                                    Ongoing
                                </option>

                                <option value="Completed"
                                {% if trek.status=="Completed" %}selected{% endif %}>
                                    Completed
                                </option>

                            </select>

                        </div>

                        <div class="d-flex justify-content-between">

                            <a href="{{ url_for('main.staff_dashboard') }}"
                               class="btn btn-outline-dark">

                                ← Dashboard

                            </a>

                            <button
                                type="submit"
                                class="btn btn-success">

                                💾 Update Status

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
