{% extends "base.html" %}

{% block title %}
Staff Profile
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow border-0">

                <div class="card-header bg-dark text-white text-center">

                    <h3 class="mb-0">
                        🧑‍💼 Update Staff Profile
                    </h3>

                </div>

                <div class="card-body p-4">

                    <form method="POST"
                          action="{{ url_for('main.staff_profile_post') }}">

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                📞 Phone Number
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="phone"
                                value="{{ profile.phone if profile else '' }}"
                                placeholder="Enter phone number">

                        </div>

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                💼 Experience
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="experience"
                                value="{{ profile.experience if profile else '' }}"
                                placeholder="Enter experience">

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                🥾 Specialization
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="specialization"
                                value="{{ profile.specialization if profile else '' }}"
                                placeholder="Enter specialization">

                        </div>

                        <div class="d-flex justify-content-between">

                            <a href="{{ url_for('main.staff_dashboard') }}"
                               class="btn btn-outline-dark">

                                ← Dashboard

                            </a>

                            <button type="submit"
                                    class="btn btn-success">

                                💾 Save Profile

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
