{% extends "base.html" %}

{% block title %}
View Users
{% endblock %}

{% block content %}

<div class="container mt-5">

    <h2>Registered Users</h2>

    <table class="table table-bordered table-hover">

        <thead class="table-dark">

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Username</th>
                <th>Role</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody>

        {% for user in users %}

            <tr>

                <td>{{ user.id }}</td>
                <td>{{ user.name }}</td>
                <td>{{ user.username }}</td>
                <td>{{ user.role }}</td>

                <td>

                    <a href="{{ url_for('main.deactivate_user', user_id=user.id) }}"
                    class="btn btn-warning btn-sm"
                    onclick="return confirm('Deactivate this user?')">

                        Deactivate

                    </a>

                </td>

            </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
